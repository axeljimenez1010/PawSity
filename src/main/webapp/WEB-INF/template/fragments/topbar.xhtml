<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <div class="topbar-container" style="background-color: #2c3e50; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <div class="logo-area" style="display: flex; align-items: center; gap: 10px;">
            <i class="pi pi-heart-fill" style="font-size: 1.5rem; color: #e74c3c;"></i>
            <h:outputText value="PawSity | Gestión de Refugio y Adopciones" style="font-size: 1.2rem; font-weight: bold;"/>
        </div>

        <h:form id="formTopbar" style="margin: 0;">
            <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
                <h:outputText value="Hola, #{usuarioSession.usuarioActual != null ? usuarioSession.usuarioActual.nombres : 'Invitado'}"
                              style="font-weight: 500;"/>

                <p:commandButton value="Cerrar Sesión" icon="pi pi-power-off"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="ui-button-danger ui-button-sm"
                                 rendered="#{usuarioSession.logueado}"/>
            </div>
        </h:form>
    </div>
</ui:composition>
